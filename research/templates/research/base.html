<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ResearchDoc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'landing' %}">ResearchDoc</a>

    <div class="navbar-nav ms-auto">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
        <a class="nav-link" href="{% url 'search' %}">Search</a>
        {% if user.is_staff %}
          <a class="nav-link" href="/admin/">Admin</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-light ms-2">Logout</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}">Login</a>
        <a class="btn btn-primary btn-sm ms-2" href="{% url 'register' %}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">
  {% for message in messages %}
    <div class="alert alert-success">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
